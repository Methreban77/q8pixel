      var bits = new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: b(D.s), iterations: D.i }, base, 256));
      var html = await unlock(bits);
      try { sessionStorage.setItem(STORE, JSON.stringify({ s: D.s, k: btoa(String.fromCharCode.apply(null, bits)) })); } catch (_) {}
      await show(html);
    } catch (err) {
      msg.style.color = '';
      msg.textContent = 'الرقم غير صحيح. حاول مرة أخرى.';
      btn.disabled = false;
      input.select();
    }
  });
})();
</script>
