<style>

  html:not(.ready) main { visibility: hidden; }

  .lock { width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center;

  .lock svg { width: 30px; height: 30px; }
  h1 { margin: 0 0 8px; font-family: 'Alexandria', 'Almarai', sans-serif; font-size: 24px; font-weight: 700; }
  p { margin: 0 0 26px; color: #b8c9d7; font-size: 15px; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input { width: 100%; height: 60px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(0, 0, 0, .25); color: #fff;
    font-size: 26px; text-align: center; letter-spacing: .4em; direction: ltr; font-family: inherit; }
  input::placeholder { color: rgba(255, 255, 255, .35); letter-spacing: .4em; }
  input:focus { outline: none; border-color: #d8bf93; box-shadow: 0 0 0 4px rgba(216, 191, 147, .2); }
  button { margin-top: 14px; width: 100%; height: 56px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #d8bf93, #c3a06a); color: #001626;

  .by { margin: 26px 0 0; font-size: 13px; color: #8da3b6; }
  .by a { color: #d8bf93; text-decoration: none; font-weight: 700; }

  var STORE = 'q8pDemoKey';
  var b = function (s) { return Uint8Array.from(atob(s), function (ch) { return ch.charCodeAt(0); }); };
