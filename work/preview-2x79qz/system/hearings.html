<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 18px; color: #fff; line-height: 1.7;
    font-family: 'Almarai', 'Segoe UI', Tahoma, sans-serif;
    background:
      radial-gradient(800px 500px at 85% 0%, rgba(29, 90, 135, .55), transparent 65%),
      radial-gradient(600px 420px at 0% 100%, rgba(168, 132, 78, .18), transparent 60%),
      linear-gradient(180deg, #00223a, #001626); }
  body::before { content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255, 255, 255, .035) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, .035) 1px, transparent 1px);
    background-size: 64px 64px; }
  html:not(.ready) main { visibility: hidden; }
  main { position: relative; width: 100%; max-width: 400px; text-align: center; padding: 44px 34px 34px; border-radius: 24px;
    background: rgba(255, 255, 255, .05); border: 1px solid rgba(216, 191, 147, .3);
    box-shadow: 0 30px 80px -30px rgba(0, 0, 0, .6); backdrop-filter: blur(10px); }
  .lock { width: 68px; height: 68px; margin: 0 auto 22px; border-radius: 50%; display: grid; place-items: center;
    background: linear-gradient(180deg, #d8bf93, #c3a06a); color: #001626; box-shadow: 0 12px 30px -10px rgba(195, 160, 106, .7); }
  .lock svg { width: 30px; height: 30px; }
  h1 { margin: 0 0 8px; font-family: 'Alexandria', 'Almarai', sans-serif; font-size: 24px; font-weight: 700; }
  p { margin: 0 0 26px; color: #b8c9d7; font-size: 15px; }
  label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  input { width: 100%; height: 60px; border-radius: 14px; border: 1px solid rgba(255, 255, 255, .22); background: rgba(0, 0, 0, .25); color: #fff;
    font-size: 26px; text-align: center; letter-spacing: .4em; direction: ltr; font-family: inherit; }
  input::placeholder { color: rgba(255, 255, 255, .35); letter-spacing: .4em; }
  input:focus { outline: none; border-color: #d8bf93; box-shadow: 0 0 0 4px rgba(216, 191, 147, .2); }
  button { margin-top: 14px; width: 100%; height: 56px; border: 0; border-radius: 999px; cursor: pointer;
    background: linear-gradient(180deg, #d8bf93, #c3a06a); color: #001626;
    font-family: 'Alexandria', 'Almarai', sans-serif; font-size: 16px; font-weight: 600; box-shadow: 0 12px 26px -12px rgba(195, 160, 106, .9); }
  button:disabled { opacity: .65; cursor: default; }
  .msg { min-height: 24px; margin: 14px 0 0; font-size: 14px; color: #ffb4ab; }
  .by { margin: 26px 0 0; font-size: 13px; color: #8da3b6; }
  .by a { color: #d8bf93; text-decoration: none; font-weight: 700; }

  var STORE = 'q8pDemoKey';
  var b = function (s) { return Uint8Array.from(atob(s), function (ch) { return ch.charCodeAt(0); }); };
