  <script>
    /* Fit the phone frame to the window before first paint (desktop/tablet only). */
    (function () {
      function fit() {
        var d = document.getElementById('device'); if (!d) return;
        var framed = window.matchMedia('(min-width: 700px) and (min-height: 560px)').matches;
        document.documentElement.classList.toggle('is-framed', framed);
        if (!framed) { d.style.zoom = ''; return; }
        /* clientWidth excludes a vertical scrollbar, so the layout never overflows sideways */
        var w = document.documentElement.clientWidth || window.innerWidth, h = window.innerHeight;
        var panel = w >= 1180 ? 430 : (w >= 900 ? 360 : 280), gap = w >= 1180 ? 96 : (w >= 900 ? 56 : 32);
        var z = Math.min(1, (h - 32) / 872, (w - panel - gap - 48) / 424);
        d.style.zoom = Math.max(.55, z).toFixed(3);
      }
      window.__fitDevice = fit; fit();
      window.addEventListener('resize', fit);
      window.addEventListener('load', fit);
    })();
  </script>
