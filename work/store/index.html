  <script>
    (function () {
      var l = 'en';
      try {
        var q = new URLSearchParams(location.search).get('lang');
        if (q === 'ar' || q === 'en') { l = q; localStorage.setItem('sadeem.lang', JSON.stringify(q)); }
        else { var s = JSON.parse(localStorage.getItem('sadeem.lang') || 'null'); if (s === 'ar' || s === 'en') l = s; }
      } catch (e) { /* storage unavailable: default to English */ }
      document.documentElement.lang = l;
      document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
    })();
  </script>
